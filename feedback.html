<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Feedback</title>
    <link rel="stylesheet" href="feedback.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="grades.html">Grades</a></li>
            <li><a href="feedback.html">Feedback</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <h1>Submit Feedback</h1>

    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>


        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

      
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="feedbackType">Feedback Type:</label><br>
        <select id="feedbackType" name="feedbackType">
            <option value="suggestion">Suggestion</option>
            <option value="complaint">Complaint</option>
            <option value="appreciation">Appreciation</option>
        </select><br><br>

    
        <label>Rate Our Website:</label><br>
        <input type="checkbox" id="excellent" name="rating" value="excellent">
        <label for="excellent">Excellent</label><br>

        <input type="checkbox" id="good" name="rating" value="good">
        <label for="good">Good</label><br>

        <input type="checkbox" id="average" name="rating" value="average">
        <label for="average">Average</label><br><br>


        <label for="message">Your Feedback:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
